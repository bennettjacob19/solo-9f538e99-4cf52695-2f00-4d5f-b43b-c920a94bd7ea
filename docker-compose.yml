services:
  db:
    # Primary: owns the registry tables and the logical publication.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drill
      POSTGRES_PASSWORD: drill
      POSTGRES_DB: drill
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_logical_replication_workers=10"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drill -d drill"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-replica:
    # Read replica fed by a real PostgreSQL logical subscription that the web
    # app creates (and can pause/resume) at startup.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drill
      POSTGRES_PASSWORD: drill
      POSTGRES_DB: drill
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      # Reconnect quickly after the subscription is resumed, so the drill's
      # "catch up after resume" step takes well under a second.
      - "wal_retrieve_retry_interval=500ms"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drill -d drill"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata_replica:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      db-replica:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://drill:drill@db:5432/drill
      REPLICA_DATABASE_URL: postgresql://drill:drill@db-replica:5432/drill
      DRILL_SESSION_PREFIX: lockdrill
      BLOCK_CONFIRM_SECONDS: "8"
      RELEASE_WAIT_SECONDS: "10"
      DRILL_TTL_SECONDS: "1800"
      REVIEW_STATEMENT_TIMEOUT_MS: "1500"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    stop_grace_period: 30s

volumes:
  pgdata:
  pgdata_replica:
